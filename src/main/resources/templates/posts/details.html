<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

    <meta charset="UTF-8">

    <title th:text="${post.title}">Post</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

    <link rel="stylesheet"
          th:href="@{/css/details.css}">

</head>

<body>

<header>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

</header>

<div class="post-container">

    <!-- ================= POST ================= -->

    <a class="back-to-home" th:href="@{/}">
        ← Back to Home
    </a>

    <div class="post-card">

        <h1 th:text="${post.title}"></h1>

        <div class="comment-header">

            <span>

                Posted by

                <strong class="comment-author"
                        th:text="${post.author.username}">
                </strong>

            </span>

            <small
                    th:text="${#temporals.format(post.createdAt,'dd MMM yyyy HH:mm')}">
            </small>

        </div>

        <p th:text="${post.content}"></p>

        <hr class="post-divider">

        <form
                sec:authorize="isAuthenticated()"
                th:action="@{/likes/{id}(id=${post.id})}"
                method="post">

            <button
                    class="like-btn"
                    type="submit">

                <span th:if="${liked}">
                    ❤️
                </span>

                <span th:unless="${liked}">
                    🤍
                </span>

                <span th:text="${post.likes.size()}"></span>

            </button>

        </form>

    </div>

    <!-- ================= COMMENTS ================= -->

    <section class="post-card">

        <h2>Comments</h2>

        <div sec:authorize="isAuthenticated()">

            <form
                    th:action="@{/comments/create/{id}(id=${post.id})}"
                    th:object="${createCommentRequest}"
                    method="post">

                <div class="comment-editor">

                    <textarea
                            th:field="*{content}"
                            placeholder="Write a comment..."
                            th:classappend="${#fields.hasErrors('content')} ? ' error'">
                    </textarea>

                    <div
                            class="field-errorr"
                            th:if="${#fields.hasErrors('content')}"
                            th:errors="*{content}">
                    </div>

                    <button
                            class="submit-btn"
                            type="submit">

                        Post Comment

                    </button>

                </div>

            </form>

        </div>

        <!-- ================= COMMENT ================= -->

        <div
                class="post-card"
                th:each="comment : ${post.comments}"
                th:if="${comment.parentComment == null}">

            <div class="comment-header">

                <strong
                        class="comment-author"
                        th:text="${comment.author.username}">
                </strong>

                <small
                        th:text="${#temporals.format(comment.createdAt,'dd MMM yyyy HH:mm')}">
                </small>

            </div>

            <form
                    th:action="@{/comments/{id}/edit(id=${comment.id})}"
                    method="post">

                    <textarea
                            class="edit-comment-textarea"
                            rows="3"
                            th:id="'comment-' + ${comment.id}"
                            name="content"
                            disabled
                            th:text="${comment.content}">
                    </textarea>

                <div class="comment-actions">

                    <button
                            type="button"
                            class="edit-comment-btn"
                            th:if="${comment.author.id == currentUser.id}"
                            th:attr="data-id=${comment.id}">

                        ✏ Edit

                    </button>

                    <button
                            type="submit"
                            class="save-comment-btn"
                            th:id="'save-comment-' + ${comment.id}"
                            style="display:none;">

                        ✔ Save

                    </button>

                    <button
                            type="button"
                            class="cancel-comment-btn"
                            th:id="'cancel-comment-' + ${comment.id}"
                            style="display:none;">

                        ✖ Cancel

                    </button>

                </div>

            </form>

            <!-- Reply Button -->

            <button
                    sec:authorize="isAuthenticated()"
                    type="button"
                    class="replyButton"
                    th:attr="data-id=${comment.id}">

                💬 Reply

            </button>

            <!-- Reply Form -->

            <div
                    class="reply-form"
                    th:id="'reply-' + ${comment.id}">

                <form
                        th:action="@{/comments/reply/{id}(id=${comment.id})}"
                        method="post">

                    <input
                            type="hidden"
                            name="postId"
                            th:value="${post.id}">

                    <textarea
                            name="content"
                            rows="4"
                            placeholder="Write your reply...">
                    </textarea>

                    <button
                            class="submit-btn"
                            type="submit">

                        Post Reply

                    </button>

                </form>

            </div>

            <!-- Replies -->

            <div
                    class="reply"
                    th:each="reply : ${comment.replies}">

                <div class="comment-header">

                    <strong
                            class="comment-author"
                            th:text="${reply.author.username}">
                    </strong>

                    <small
                            th:text="${#temporals.format(reply.createdAt,'dd MMM yyyy HH:mm')}">
                    </small>

                </div>

                <form
                        th:action="@{/comments/{id}/edit(id=${reply.id})}"
                        method="post">

                    <textarea
                            class="edit-comment-textarea"
                            rows="3"
                            th:id="'comment-' + ${reply.id}"
                            name="content"
                            disabled
                            th:text="${reply.content}">
                    </textarea>

                    <div class="comment-actions">

                        <button
                                type="button"
                                class="edit-comment-btn"
                                th:if="${reply.author.id == currentUser.id}"
                                th:attr="data-id=${reply.id}">

                            ✏ Edit

                        </button>

                        <button
                                type="submit"
                                class="save-comment-btn"
                                th:id="'save-comment-' + ${reply.id}"
                                style="display:none;">

                            ✔ Save

                        </button>

                        <button
                                type="button"
                                class="cancel-comment-btn"
                                th:id="'cancel-comment-' + ${reply.id}"
                                style="display:none;">

                            ✖ Cancel

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </section>

</div>

<script th:src="@{/js/app.js}"></script>

</body>

</html>
