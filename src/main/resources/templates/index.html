<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Community Forum</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<!-- ================= NAVBAR ================= -->

<header>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

</header>

<!-- ================= HERO ================= -->

<section class="hero">

    <h1>Welcome to Community Forum</h1>

    <p>
        Share your ideas, ask questions,
        and join discussions on any topic.
    </p>


    <!-- Logged user -->
    <button
            sec:authorize="isAuthenticated()"
            id="createPostButton"
            class="create-btn"
            type="button">
        Create Post
    </button>

    <!-- Anonymous -->
    <button
            sec:authorize="isAnonymous()"
            id="guestCreatePostButton"
            class="create-btn"
            type="button">
        Create Post
    </button>

</section>

<!-- ================= STATS ================= -->

<section class="stats">

    <div class="stat-card">

        <h2 th:text="${userCount}">0</h2>

        <p>Registered Users</p>

    </div>

    <div class="stat-card">

        <h2 th:text="${postCount}">0</h2>

        <p>Posts</p>

    </div>

</section>

<!-- ================= LATEST POSTS ================= -->

<section class="posts-section">

    <h2>Latest Posts</h2>

    <div class="posts-grid">

        <div class="post-card"
             th:each="post : ${latestPosts}">

            <h3 th:text="${post.title}">
                Post title
            </h3>

            <p class="description"
               th:text="${post.content}">
                Description
            </p>

            <div class="card-footer">

                <span>
                    ❤️
                    <span th:text="${post.likes.size()}">0</span>
                </span>

                <span>
                    💬
                    <span th:text="${post.comments.size()}">0</span>
                </span>

            </div>

            <a class="read-more"
               th:href="@{/posts/{id}(id=${post.id})}">
                Read More →
            </a>

        </div>

    </div>

</section>

<!-- ================= TOP COMMENTED ================= -->

<section class="posts-section">

    <h2>Top Commented Posts</h2>

    <div class="posts-grid">

        <div class="post-card"
             th:each="post : ${topCommentedPosts}">

            <h3 th:text="${post.title}">
                Post title
            </h3>

            <p class="description"
               th:text="${post.content}">
                Description
            </p>

            <div class="card-footer">

                <span>
                    ❤️
                    <span th:text="${post.likes.size()}">0</span>
                </span>

                <span>
                    💬
                    <span th:text="${post.comments.size()}">0</span>
                </span>

            </div>

            <a class="read-more"
               th:href="@{/posts/{id}(id=${post.id})}">
                Read More →
            </a>

        </div>

    </div>

</section>

<!-- ================= LOGIN MODAL ================= -->

<div th:replace="~{fragments/authModal :: authModal}"></div>

<div
        sec:authorize="isAuthenticated()"
        th:replace="~{fragments/postModal :: createPostModal}">
</div>

<!-- ================= FOOTER ================= -->

<div th:replace="~{fragments/footer :: footer}"></div>

<input
        type="hidden"
        id="loginError"
        th:value="${loginError}">

<input
        type="hidden"
        id="showRegister"
        th:value="${showRegister}">

<script th:src="@{/js/app.js}"></script>
</body>
</html>
