<div th:fragment="authModal">

    <div id="authModal" class="modal">

        <div class="auth-card">

            <!-- Header -->

            <div class="auth-header">

                <h2>💬 Community Forum</h2>

                <p>
                    Join thousands of car enthusiasts around the world.
                </p>

            </div>

            <!-- Tabs -->

            <div class="tabs">

                <button
                        id="loginTab"
                        type="button"
                        class="active">

                    Login

                </button>

                <button
                        id="registerTab"
                        type="button">

                    Register

                </button>

            </div>

            <!-- LOGIN -->

            <div id="loginForm">

                <div
                        class="error-message"
                        th:if="${loginError}">

                    Invalid username or password.

                </div>

                <form
                        th:action="@{/login}"
                        method="post">

                    <div class="form-group">

                        <label>Username</label>

                        <input
                                type="text"
                                name="username"
                                placeholder="Enter username">

                    </div>

                    <div class="form-group">

                        <label>Password</label>

                        <input
                                type="password"
                                name="password"
                                placeholder="Enter password">

                    </div>

                    <button
                            class="submit-btn"
                            type="submit">

                        Login

                    </button>

                    <p class="switch-text">

                        Don't have an account?

                        <span id="openRegister">

                            Register

                        </span>

                    </p>

                </form>

            </div>

            <!-- REGISTER -->

            <div
                    id="registerForm"
                    style="display:none;">

                <form
                        th:action="@{/users/register}"
                        th:object="${registerRequest}"
                        method="post">

                    <div
                            class="error-message"
                            th:if="${registrationError}"
                            th:text="${registrationError}">
                    </div>

                    <div class="form-row">

                        <div class="form-group">

                            <label>Username</label>

                            <input
                                    type="text"
                                    th:field="*{username}">

                            <div
                                    class="field-error"
                                    th:errors="*{username}">
                            </div>

                        </div>

                    </div>

                    <div class="form-row">

                        <div class="form-group">

                            <label>First Name</label>

                            <input
                                    type="text"
                                    th:field="*{firstName}">

                            <div
                                    class="field-error"
                                    th:errors="*{firstName}">
                            </div>

                        </div>

                        <div class="form-group">

                            <label>Last Name</label>

                            <input
                                    type="text"
                                    th:field="*{lastName}">

                            <div
                                    class="field-error"
                                    th:errors="*{lastName}">
                            </div>

                        </div>

                    </div>

                    <div class="form-group">

                        <label>Email</label>

                        <input
                                type="email"
                                th:field="*{email}">

                        <div
                                class="field-error"
                                th:errors="*{email}">
                        </div>

                    </div>

                    <div class="form-group">

                        <label>Password</label>

                        <input
                                type="password"
                                th:field="*{password}">

                        <div
                                class="field-error"
                                th:errors="*{password}">
                        </div>

                    </div>

                    <button
                            class="submit-btn"
                            type="submit">

                        Create Account

                    </button>

                    <p class="switch-text">

                        Already have an account?

                        <span id="openLogin">

                            Login

                        </span>

                    </p>

                </form>

            </div>

        </div>

    </div>

</div>
