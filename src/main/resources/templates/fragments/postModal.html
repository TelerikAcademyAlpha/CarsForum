<div
        th:fragment="createPostModal"
        id="createPostModal"
        class="modal">

    <div class="post-card-modal">

        <h2>Create Post</h2>

        <form
                th:action="@{/posts/create}"
                th:object="${createPostRequest}"
                method="post">

            <div class="form-group">

                <label>Title</label>

                <input
                        type="text"
                        th:field="*{title}"
                        maxlength="120">

                <div
                        class="field-error"
                        th:errors="*{title}">
                </div>

            </div>

            <div class="form-group">

                <label>Content</label>

                <textarea
                        th:field="*{content}"
                        rows="10">
                </textarea>

                <div
                        class="field-error"
                        th:errors="*{content}">
                </div>

            </div>

            <button
                    class="submit-btn"
                    type="submit">

                Publish Post

            </button>

        </form>

    </div>

</div>
