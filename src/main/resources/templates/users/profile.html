<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>My Profile</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

    <link rel="stylesheet"
          th:href="@{/css/profile.css}">

</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<section class="profile-section">

    <div class="profile-card">

        <h1>👤 My Profile</h1>

        <form
                th:action="@{/users/profile}"
                method="post"
                id="profileForm">

            <div class="info-row">

                <span>Username</span>

                <input
                        type="text"
                        th:value="${user.username}"
                        disabled>

            </div>

            <div class="info-row">

                <span>First Name</span>

                <input
                        type="text"
                        name="firstName"
                        th:value="${user.firstName}"
                        disabled>

            </div>

            <div class="info-row">

                <span>Last Name</span>

                <input
                        type="text"
                        name="lastName"
                        th:value="${user.lastName}"
                        disabled>

            </div>

            <div class="info-row">

                <span>Email</span>

                <input
                        type="email"
                        name="email"
                        th:value="${user.email}"
                        disabled>

            </div>

            <button
                    type="submit"
                    class="edit-profile-btn"
                    id="saveBtn"
                    style="display:none;">

                Save Changes

            </button>

        </form>
        <button
                type="button"
                class="edit-profile-btn"
                id="openEditProfile">

            Edit Profile

        </button>

    </div>

</section>

<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/app.js}"></script>
</body>

</html>
